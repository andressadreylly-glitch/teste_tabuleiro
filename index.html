<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Mesa Virtual VTT - Jogos de Tabuleiro</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- SDK do Firebase (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>

  <!-- TELA 1: LOGIN / CADASTRO DE PERFIL -->
  <section id="screen-login" class="screen active">
    <div class="card login-card">
      <h2>Criar Perfil</h2>
      <form id="login-form">
        <div class="form-group">
          <label for="input-username">Nome</label>
          <input type="text" id="input-username" placeholder="Seu apelido" required>
        </div>
        <div class="form-group">
          <label for="input-email">E-mail</label>
          <input type="email" id="input-email" placeholder="seu@email.com" required>
        </div>
        <div class="form-group">
          <label for="input-password">Senha</label>
          <input type="password" id="input-password" placeholder="******" required>
        </div>
        <button type="submit" class="btn-primary full-width">Entrar / Criar Perfil</button>
      </form>
    </div>
  </section>

  <!-- TELA 2: PESQUISA E CRIAÇÃO DE SALAS -->
  <section id="screen-rooms" class="screen">
    <div class="card rooms-card">
      <h2>Salas Disponíveis</h2>
      
      <!-- Formulário para Criar Nova Sala -->
      <form id="create-room-form" class="create-room-form">
        <div class="form-group">
          <input type="text" id="create-room-name" placeholder="Nome da Nova Sala" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="create-room-max">Máx. Jogadores</label>
            <input type="number" id="create-room-max" value="4" min="2" max="10" required>
          </div>
          <div class="form-group">
            <label for="create-room-status">Status Inicial</label>
            <select id="create-room-status">
              <option value="waiting">Aguardando</option>
              <option value="progress">Em andamento</option>
            </select>
          </div>
        </div>
        <button type="submit" class="btn-primary full-width">➕ Criar Sala</button>
      </form>

      <hr class="divider">

      <!-- Barra de Busca -->
      <div class="search-bar form-group">
        <input type="text" id="search-input" placeholder="Buscar sala pelo nome...">
      </div>
      <ul class="room-list" id="room-list">
        <!-- Salas geradas via JavaScript -->
      </ul>
    </div>
  </section>

  <!-- TELA 3: TABULEIRO PRINCIPAL (INTERFACE VTT) -->
  <section id="screen-board" class="screen">
    <button id="btn-toggle-sidebar" class="mobile-menu-btn">☰ Menu</button>
    <div id="sidebar-overlay" class="overlay"></div>

    <div class="app-container">
      <!-- PAINEL LATERAL (SIDEBAR) -->
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
          <h2 id="current-room-title">Mesa VTT</h2>
          <button id="btn-close-sidebar" class="close-btn">&times;</button>
        </div>

        <!-- JOGADORES ONLINE -->
        <section class="panel-section">
          <h3>Jogadores Online</h3>
          <div id="online-players-list" class="players-list"></div>
        </section>

        <!-- CONFIGURAÇÃO DO MAPA -->
        <section class="panel-section">
          <h3>Mapa de Fundo</h3>
          <div class="form-group">
            <label for="input-bg-image">Imagem do Mapa:</label>
            <input type="file" id="input-bg-image" accept="image/*" />
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="input-grid-size">Grid (Células):</label>
              <input type="number" id="input-grid-size" value="20" min="5" max="100" />
            </div>
            <button id="btn-remove-bg" class="btn-secondary">Remover</button>
          </div>
        </section>

        <!-- CRIAR NOVO TOKEN -->
        <section class="panel-section">
          <h3>Criar Token</h3>
          <div class="form-group">
            <input type="text" id="token-name" placeholder="Nome (ex: Monstro)" />
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="token-color">Cor:</label>
              <input type="color" id="token-color" value="#ff4757" />
            </div>
            <div class="form-group">
              <label for="token-size">Tamanho:</label>
              <select id="token-size">
                <option value="1">1x1 (Médio)</option>
                <option value="2">2x2 (Grande)</option>
                <option value="3">3x3 (Enorme)</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label for="token-image">Imagem (Opcional):</label>
            <input type="file" id="token-image" accept="image/*" />
          </div>
          <button id="btn-add-token" class="btn-primary full-width">Adicionar ao Mapa</button>
        </section>

        <!-- ROLADOR DE DADOS -->
        <section class="panel-section">
          <h3>Rolador de Dados</h3>
          <div class="dice-grid">
            <button class="dice-btn" data-dice="4">d4</button>
            <button class="dice-btn" data-dice="6">d6</button>
            <button class="dice-btn" data-dice="8">d8</button>
            <button class="dice-btn" data-dice="10">d10</button>
            <button class="dice-btn" data-dice="12">d12</button>
            <button class="dice-btn" data-dice="20">d20</button>
          </div>
          <div id="dice-log" class="dice-log"></div>
        </section>

        <!-- AÇÕES DA SALA -->
        <section class="panel-section">
          <button id="btn-leave-room" class="btn-secondary full-width">Sair da Sala</button>
        </section>
      </aside>

      <!-- ÁREA PRINCIPAL DO CANVAS -->
      <main id="canvas-wrapper" class="canvas-wrapper">
        <div class="toolbar">
          <button id="tool-select" class="tool-btn active">✋ Mover</button>
          <button id="tool-draw" class="tool-btn">✏️ Desenhar</button>
          <button id="btn-clear-drawings" class="tool-btn danger">🗑️ Limpar Desenhos</button>
        </div>

        <div class="zoom-controls">
          <button id="btn-zoom-in">+</button>
          <button id="btn-zoom-reset">100%</button>
          <button id="btn-zoom-out">-</button>
        </div>

        <canvas id="vtt-canvas"></canvas>
      </main>
    </div>
  </section>

  <!-- MENU CONTEXTUAL DO TOKEN -->
  <div id="token-context-menu" class="context-menu" style="display: none;">
    <div class="menu-item" id="ctx-open-modal">⚙️ Editar Token</div>
    <div class="menu-item danger" id="ctx-delete">🗑️ Excluir Token</div>
  </div>

  <!-- MODAL DE EDIÇÃO DE TOKEN -->
  <div id="token-modal-overlay" class="modal-overlay" style="display: none;">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Editar Token</h3>
        <button type="button" id="modal-close-btn" class="modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <div class="token-preview-container">
          <div id="modal-token-preview" class="token-preview">
            <span id="modal-preview-name">Token</span>
          </div>
        </div>
        <div class="form-group">
          <label for="modal-input-name">Nome do Token</label>
          <input type="text" id="modal-input-name" placeholder="Nome" />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="modal-input-color">Cor da Borda</label>
            <input type="color" id="modal-input-color" value="#ff4757" />
          </div>
          <div class="form-group">
            <label for="modal-input-size">Tamanho (Células)</label>
            <select id="modal-input-size">
              <option value="1">1x1 (Médio)</option>
              <option value="2">2x2 (Grande)</option>
              <option value="3">3x3 (Enorme)</option>
              <option value="4">4x4 (Imenso)</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label for="modal-input-image">Trocar Imagem</label>
          <input type="file" id="modal-input-image" accept="image/*" />
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" id="modal-save-btn" class="btn-primary full-width">Salvar Alterações</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
