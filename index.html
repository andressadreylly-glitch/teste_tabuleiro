<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Virtual Tabletop (VTT)</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Firebase App e Database SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<!-- MENU CONTEXTUAL DO TOKEN -->
<div id="token-context-menu" class="context-menu" style="display: none; position: absolute; z-index: 1000;">
  <div class="menu-item" id="ctx-edit-name">✏️ Alterar Nome</div>
  <div class="menu-item" id="ctx-edit-color">🎨 Alterar Cor</div>
  <div class="menu-item" id="ctx-edit-size">📐 Alterar Tamanho</div>
  <div class="menu-item" id="ctx-edit-image">🖼️ Alterar Imagem</div>
  <div class="menu-item danger" id="ctx-delete">🗑️ Excluir Token</div>
</div>

<!-- Input escondido para trocar imagem via menu -->
<input type="file" id="ctx-image-input" accept="image/*" style="display: none;">
<body>

  <!-- Overlay para fechar sidebar no mobile -->
  <div id="sidebar-overlay"></div>

  <!-- Botão para abrir sidebar no mobile -->
  <button id="btn-toggle-sidebar" class="mobile-toggle-btn">☰ Menu</button>

  <div id="app-container">
    <!-- Barra Lateral de Controles -->
    <aside id="sidebar">
      <div class="sidebar-header">
        <h2>Painel de Controle</h2>
        <button id="btn-close-sidebar" class="mobile-close-btn">&times;</button>
      </div>

      <!-- Seção de Conexão -->
      <div class="sidebar-section">
        <h3>Conexão da Sala</h3>
        <input type="text" id="input-username" placeholder="Seu Nome / Nickname" />
        <input type="text" id="input-room-id" placeholder="Código da Sala (ex: mesa1)" />
        <button id="btn-connect-room">Entrar na Sala</button>

        <div class="players-online-container">
          <h4>Jogadores Conectados:</h4>
          <div id="online-players-list"></div>
        </div>
      </div>

      <!-- Ferramentas -->
      <div class="sidebar-section">
        <h3>Ferramentas</h3>
        <div class="tools-grid">
          <button id="tool-select" class="tool-btn active">Selecionar/Mover</button>
          <button id="tool-draw" class="tool-btn">Desenhar</button>
        </div>
        <button id="btn-clear-drawings" class="danger-btn">Limpar Desenhos</button>
      </div>

      <!-- Configurações do Mapa -->
      <div class="sidebar-section">
        <h3>Mapa</h3>
        <label>Imagem do Mapa:</label>
        <input type="file" id="input-bg-image" accept="image/*" />
        <button id="btn-remove-bg" class="secondary-btn">Remover Mapa</button>

        <label for="input-grid-size">Tamanho do Grid (Células):</label>
        <input type="number" id="input-grid-size" value="20" min="5" max="100" />
      </div>

      <!-- Criar Tokens -->
      <div class="sidebar-section">
        <h3>Adicionar Token</h3>
        <input type="text" id="token-name" placeholder="Nome do Personagem" />
        <label>Cor da Borda:</label>
        <input type="color" id="token-color" value="#ff4757" />
        <label>Tamanho (Células):</label>
        <input type="number" id="token-size" value="1" min="1" max="5" />
        <label>Imagem do Token:</label>
        <input type="file" id="token-image" accept="image/*" />
        <button id="btn-add-token">Criar Token</button>
      </div>

      <!-- Rolador de Dados -->
      <div class="sidebar-section">
        <h3>Rolador de Dados</h3>
        <div class="dice-grid">
          <button class="dice-btn" data-dice="4">d4</button>
          <button class="dice-btn" data-dice="6">d6</button>
          <button class="dice-btn" data-dice="8">d8</button>
          <button class="dice-btn" data-dice="10">d10</button>
          <button class="dice-btn" data-dice="12">d12</button>
          <button class="dice-btn" data-dice="20">d20</button>
          <button class="dice-btn" data-dice="100">d100</button>
        </div>
        <div id="dice-log"></div>
      </div>
    </aside>

    <!-- Área Principal do Canvas -->
    <main id="canvas-wrapper">
      <canvas id="vtt-canvas"></canvas>

      <!-- Controles Flutuantes de Zoom -->
      <div id="zoom-controls">
        <button id="btn-zoom-in">+</button>
        <button id="btn-zoom-reset">100%</button>
        <button id="btn-zoom-out">-</button>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
